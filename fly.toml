app = "animesh-runpod-gpu-availability"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
DATABASE_PATH = "/data/availability.sqlite3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "availability_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
memory = "256mb"
