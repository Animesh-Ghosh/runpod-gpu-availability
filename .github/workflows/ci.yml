name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            runtime:
              - 'Dockerfile'
              - '.dockerignore'
              - 'Gemfile'
              - 'Gemfile.lock'
              - 'config.ru'
              - 'bin/**'
              - 'db/**'
              - 'fly.toml'
              - 'lib/**'
              - 'views/**'

  test:
    concurrency:
      group: ci-test-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          bundler-cache: true
      - run: bundle exec rake test

  lint:
    continue-on-error: true
    concurrency:
      group: ci-lint-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          bundler-cache: true
      - run: bundle exec rubocop

  image:
    if: github.event_name == 'pull_request' && needs.changes.outputs.runtime == 'true'
    needs: [test, changes]
    concurrency:
      group: ci-image-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag runpod-gpu-availability:ci .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.runtime == 'true'
    needs: [test, changes]
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app animesh-runpod-gpu-availability
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
